[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "click-to-mcp"
version = "0.4.0"
description = "Auto-wrap any Click/typer CLI as an MCP (Model Context Protocol) server — with auto-discovery"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Revenue Holdings", email = "dev@revenueholdings.dev" },
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
]
keywords = ["mcp", "click", "cli", "model-context-protocol", "ai", "discovery"]

[project.urls]
Homepage = "https://github.com/Coding-Dev-Tools/click-to-mcp"
Repository = "https://github.com/Coding-Dev-Tools/click-to-mcp"

[project.scripts]
click-to-mcp = "click_to_mcp.cli:main"
click-to-mcp-demo = "click_to_mcp.demo:cli"

[tool.setuptools.packages.find]
include = ["click_to_mcp*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
http = [
    "httpx>=0.27.0",
    "starlette>=0.37.0",
    "uvicorn>=0.27.0",
    "sse-starlette>=1.6.0",
]
